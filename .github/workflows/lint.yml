name: Lint code

on: ["push","pull_request"]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, zip
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer update --no-interaction --no-progress

      - name: Run Linter
        run: composer run lint -- --check
